<section class="gallery-section">
  <h2>Illustrations</h2>

  <div class="gallery-grid">

    <button class="gallery-item" data-full="img/gerta!.jpg" data-title="The Princess" data-desc="Early stages of designs for Darling Dress Up! I made this using ink and acrylic markers.">
      <img src="img/gerta!.jpg"  height="300"  alt="The Princess">
    </button>

    <button class="gallery-item" data-full="img/unnamed.jpg" data-title="Ledge" data-desc="I created this for a small story I made a while ago, as if it was a book cover. I made this using clip studio paint.">
      <img src="img/unnamed.jpg" height="300"  alt="The Lovers">
    </button>

    <button class="gallery-item" data-full="img/seline.PNG" data-title="Seline" data-desc="A portrait, this was my first time really using a monochromatic palette on a digital canvas so I really wanted to push the values. I made this using Clip Studio Paint.">
      <img src="img/seline.PNG" height="300"  alt="Seline">
    </button>

    <button class="gallery-item" data-full="img/frankieweb.PNG" data-title="Frankie" data-desc="A frankenstein girl with lots and lots of hatching. This was going to be the original chatracter for darling dress up. I made this using clip studio paint.">
      <img src="img/frankieweb.PNG" height="300"  alt="Frankie">
    </button>

        <button class="gallery-item" data-full="img/vecjericho.PNG" data-title="Jericho" data-desc="I wanted Jerichos mask to be the main focal point, so I put the most detail on it. The cool toned colors for her connection to he moon, this was early in her design stage so its concept art. I made this using clip studio paint. ">
      <img src="img/vecjericho.PNG" height="300"  alt="Jericho">
    </button>

    <button class="gallery-item" data-full="img/IMG_9684.png" data-title="The Lovers?" data-desc=" This piece is inspired by the painting called 'The Lovers' by Gustav Klimt. I wanted to give the same feeling of warmth and love but I wanted it to be a parallel of the original painting so I used cool tones to give it a feeling of melencholy. I used guache, watercolor pencils, and watered down ink.">
      <img src="img/IMG_9684.png"  height="300" alt="Broken Doll">
    </button>

        <button class="gallery-item" data-full="img/edythe.png" data-title="Edythe" data-desc="Early stage design of edythe! This was a very different concept of how she actually came out. She originally was evil and manipulative. so i wanted her mischevious pose to show that, using warm tones to make her look more inviting. I made this using clip studio paint.">
      <img src="img/edythe.png" height="300"  alt="Edythe">
    </button>

  </div>
</section>

<section class="gallery-section">
  <h2>Character Designs</h2>

  <div class="gallery-grid">



    <button class="gallery-item" data-full="img/renesmefull.PNG" data-title="Renesme" data-desc="Full body design of Renesme, I wanted to use a cool action pose for her rapier, and the cool shadow effect to show its magical. I used warm lighting to contrast with his cool color palette and skin, just to keep a little variety in the piece. I made this using Clip studio paint.">
      <img src="img/renesmefull.PNG"  height="300" alt="Renesme">
    </button>

    <button class="gallery-item" data-full="img/rosettafull.PNG" data-title="Rosetta" data-desc="Full body character design of Rosetta. She is a belly dancing fighter, I wanted to show that with her pose, and jewlery. I balanced her femininity with her fighting side. I documented the front and back of her design and her pet snake! I made this using Clip Studio Paint.">
      <img src="img/rosettafull.PNG"  height="300" alt="Rosetta">
    </button>

    <button class="gallery-item" data-full="img/selinefullbody.PNG" data-title="Seline" data-desc="Full body character design of Seline. She is a religous person, so I displayed that in her robes. Her character involves alot of necromancy, and overall has a bland personality. So, She has a greyscale color palette, like the life was drained out of her. I made this using Clip Studio Paint">
      <img src="img/selinefullbody.PNG"  height="300" alt="Seline full body">
    </button>

    <button class="gallery-item" data-full="img/outfit1.png" data-title="Alternative Outfit" data-desc="Character outfit variation design for Renesme. I love designing dresses, and costume design. I wanted to do a what if? for my character Renesme if she went to a ball. I made this using procreate">
      <img src="img/outfit1.png" height="300"  alt="Outfit design">
    </button>

    <button class="gallery-item" data-full="img/IMG_3621.jpeg" data-title="Edythe final design" data-desc="Character design of a rookie knight! I wanted to show her youth, but also her armor to show her occupation. I used both red and blue to display power. I used clip studio paint to make this .">
      <img src="img/IMG_3621.jpeg" height="300"  alt="Character study">
    </button>

  </div>
</section>

    <button class="gallery-item" data-full="img/partysketch.png" data-title="The Squad" data-desc="Group composition sketch. The chess pieces correlate to their personality, the 3 characters to the left are my friends characters. I made this using Clip Studio Paint.">

   <button class="gallery-item" data-full="img/IMG_3666.jpeg" data-title="Sketch Study" data-desc="Loose colored sketh, This was in development of her final outfit. I was just testing things out. I made this using Clip Studio Paint.">

    <button class="gallery-item" data-full="img/selinesketch.jpeg" data-title="Seline Sketch" data-desc="Journal sketch entry for my junk journal. I made this using pen and paper.">

    <button class="gallery-item" data-full="img/ismarkweb.PNG" data-title="Ivan" data-desc=" Character expression studies, simple sketches. I made this using Clip Studio Paint">

    <button class="gallery-item" data-full="img/ireneweb.PNG" data-title="Irene" data-desc=" Character expression studies, simple sketches. I made this using Clip Studio Paint">

    <button class="gallery-item" data-full="img/rosettaweb.PNG" data-title="Rosetta Expressions" data-desc=" Character expression studies, simple sketches. I made this using Clip Studio Paint">

    <button class="gallery-item" data-full="img/IMG_3657.jpeg" data-title="Sketch Study" data-desc="Loose sketch  for edythe and her pet rat. I made this using Clip Studio Paint.">

    </button>
